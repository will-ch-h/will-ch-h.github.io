name: Convert images to WebP

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Convert images and rewrite references
        run: python3 .github/scripts/convert_to_webp.py .

      - name: Commit changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Convert images to WebP"
          git push
